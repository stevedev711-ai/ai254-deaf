name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 35, NDK and CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "cmake;3.22.1" "ndk;27.0.12077973" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AI254-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI254-debug-apk
          path: AI254-debug.apk

      - name: Publish APK as a GitHub release (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" AI254-debug.apk \
            --target "${{ github.sha }}" \
            --title "AI254 debug build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. Install on an Android 13+ ARM64 phone. Not signed for Play Store release."
